[project]
name = "szakdolgozat-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lehel", email = "lehel886@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
szakdolgozat-backend = "szakdolgozat_backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
